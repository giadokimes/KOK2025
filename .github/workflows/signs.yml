name: Fetch traffic sign SVGs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/signs.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ALL R-* signs from Wikimedia
        run: |
          python3 <<'PYEOF'
          import json, urllib.request, urllib.parse, urllib.error, os, time, re

          ua = "KOK-App/1.0 (https://github.com/giadokimes/KOK2025)"

          api_url = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
              "action": "query",
              "list": "allimages",
              "aiprefix": "Traffic_Sign_GR_-_KOK_2009_-_R-",
              "ailimit": "500",
              "aiprop": "url",
              "format": "json"
          })
          req = urllib.request.Request(api_url, headers={"User-Agent": ua})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read())

          all_images = data.get("query", {}).get("allimages", [])
          print(f"Found {len(all_images)} R-* images on Wikimedia")

          os.makedirs("signs", exist_ok=True)
          ok, fail = 0, 0
          for img in all_images:
              name = img["name"]
              url = img["url"]
              m = re.match(r"Traffic_Sign_GR_-_KOK_2009_-_(R-[A-Za-z0-9]+)\.svg$", name)
              if not m:
                  continue
              code = m.group(1)
              out = f"signs/{code}.svg"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                  if b"<svg" not in data[:300].lower():
                      print(f"SKIP {code}")
                      continue
                  with open(out, "wb") as f:
                      f.write(data)
                  print(f"OK {code}")
                  ok += 1
                  time.sleep(0.5)
              except Exception as e:
                  print(f"FAIL {code}: {e}")
                  fail += 1

          print(f"Download done: OK={ok} FAIL={fail}")

          mapping = {}
          for f in sorted(os.listdir("signs")):
              if not f.endswith(".svg"):
                  continue
              path = f"signs/{f}"
              with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                  head = fh.read(300)
              if "<svg" not in head.lower():
                  continue
              code = f.replace(".svg", "").replace("R-", "Ρ-")
              mapping[code] = path

          with open("signs-data.json", "w", encoding="utf-8") as fh:
              json.dump(mapping, fh, ensure_ascii=False, indent=2)
          print(f"Wrote {len(mapping)} entries")
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signs/ signs-data.json
          git commit -m "Auto: fetch ALL R-* signs from Wikimedia" || echo "Nothing to commit"
          git push
