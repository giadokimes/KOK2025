name: Fetch traffic sign SVGs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-signs.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clean old signs folder
        run: rm -rf signs && mkdir -p signs

      - name: Download signs from upload.wikimedia.org (with MD5 hash path)
        run: |
          python3 <<'EOF'
          import hashlib, urllib.request, os

          # Όλα τα ονόματα αρχείων πινακίδων
          codes = [f"R-{i}" for i in range(1, 78)]
          codes += ["R-32a","R-32d","R-50a","R-50d","R-51a","R-51d",
                    "R-52a","R-52d","R-66a","R-67a","R-73a","R-73d",
                    "R-74a","R-74d"]

          ua = "KOK-App/1.0 (https://github.com/giadokimes/KOK2025)"
          ok, fail = 0, 0

          for code in codes:
              filename = f"Traffic_Sign_GR_-_KOK_2009_-_{code}.svg"
              md5 = hashlib.md5(filename.encode("utf-8")).hexdigest()
              url = f"https://upload.wikimedia.org/wikipedia/commons/{md5[0]}/{md5[0:2]}/{filename}"
              out = f"signs/{code}.svg"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read()
                  # Έλεγχος ότι είναι SVG, όχι HTML error
                  head = data[:300].lower()
                  if b"<svg" not in head:
                      print(f"❌ {code}: δεν είναι SVG")
                      fail += 1
                      continue
                  with open(out, "wb") as f:
                      f.write(data)
                  print(f"✅ {code}: {len(data)} bytes")
                  ok += 1
              except Exception as e:
                  print(f"❌ {code}: {e}")
                  fail += 1

          print(f"\n✅ Επιτυχία: {ok} | ❌ Αποτυχία: {fail}")
          EOF

      - name: Generate signs-data.json
        run: |
          python3 <<'EOF'
          import json, os
          mapping = {}
          for f in sorted(os.listdir("signs")):
              if not f.endswith(".svg"): continue
              path = f"signs/{f}"
              if os.path.getsize(path) < 500: continue
              with open(path, "r", encoding="utf-8", errors="ignore") as fh:
                  head = fh.read(300)
              if "<svg" not in head.lower(): continue
              code = f.replace(".svg", "").replace("R-", "Ρ-")
              mapping[code] = path
          with open("signs-data.json", "w", encoding="utf-8") as fh:
              json.dump(mapping, fh, ensure_ascii=False, indent=2)
          print(f"Wrote {len(mapping)} entries in signs-data.json")
          print("Πρώτα κλειδιά:", list(mapping.keys())[:5])
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signs/ signs-data.json
          git commit -m "Auto: re-fetch signs from upload.wikimedia.org" || echo "Nothing to commit"
          git push
