<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Lightbox Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fb;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-height: 100vh;
        }
        button {
            padding: 14px 30px;
            font-size: 18px;
            font-weight: 700;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        button:hover {
            background: #b91c1c;
        }

        /* LIGHTBOX */
        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            cursor: pointer;
        }
        .lightbox-overlay .lightbox-image {
            max-width: 100%;
            max-height: calc(100% - 180px);
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.4);
            touch-action: pinch-zoom;
            cursor: default;
            margin-bottom: 8px;
        }
        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.5);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 28px;
        }
        .lightbox-close:hover {
            background: rgba(0,0,0,0.8);
        }
        .lightbox-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.3);
            padding: 4px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .lightbox-tab {
            padding: 6px 20px;
            border: none;
            border-radius: 30px;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lightbox-tab.active {
            background: #dc2626;
            color: #fff;
            box-shadow: 0 2px 8px rgba(220,38,38,0.3);
        }
        .lightbox-tab:hover {
            color: #fff;
        }
        .lightbox-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }
        .lightbox-call-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lightbox-call-btn:hover {
            background: #b91c1c;
            transform: scale(1.03);
        }
        .lightbox-label {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            margin-right: 2px;
        }
        .lightbox-metronome,
        .lightbox-timer {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .lightbox-tool-btn {
            background: rgba(255,255,255,0.12);
            border: none;
            color: #fff;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .lightbox-tool-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .lightbox-tool-btn.active {
            background: #dc2626;
            color: #fff;
        }
        .lightbox-pulse {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: background 0.1s;
        }
        .lightbox-pulse.active {
            background: #dc2626;
            animation: pulse-indicator 0.55s ease-in-out infinite;
        }
        @keyframes pulse-indicator {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .lightbox-timer-display {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        @media (max-width: 480px) {
            .lightbox-controls { padding: 6px 10px; gap: 8px; }
            .lightbox-call-btn { font-size: 11px; padding: 4px 10px; }
            .lightbox-tool-btn { font-size: 11px; padding: 3px 8px; }
            .lightbox-timer-display { font-size: 14px; min-width: 30px; }
            .lightbox-close { width: 40px; height: 40px; font-size: 24px; }
            .lightbox-tab { font-size: 13px; padding: 4px 14px; }
        }
    </style>
</head>
<body>

    <h2>Δοκιμή Lightbox</h2>
    <button onclick="openLightbox()">Άνοιξε Lightbox</button>

    <!-- LIGHTBOX -->
    <div id="testLightbox" class="lightbox-overlay">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>

        <div class="lightbox-tabs">
            <button class="lightbox-tab active" data-card="cpr" onclick="switchCard('cpr')">ΚΑΡΠΑ</button>
            <button class="lightbox-tab" data-card="aed" onclick="switchCard('aed')">AED</button>
        </div>

        <img id="testLightboxImage" src="cpr-card.png" alt="ΚΑΡΠΑ" class="lightbox-image">

        <div class="lightbox-controls">
            <button class="lightbox-call-btn" onclick="makeCall()">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <span>166 / 112</span>
            </button>
            <div class="lightbox-metronome" id="testMetronomeGroup">
                <span class="lightbox-label">Μετρονόμος</span>
                <button class="lightbox-tool-btn" id="testMetronomeBtn" onclick="toggleMetronome()">
                    <span>▶</span>
                    <span id="testMetronomeStatus">Έναρξη</span>
                </button>
                <span class="lightbox-pulse" id="testPulseIndicator"></span>
            </div>
            <div class="lightbox-timer" id="testTimerGroup" style="display:none;">
                <span class="lightbox-label">Χρονόμετρο</span>
                <button class="lightbox-tool-btn" id="testTimerBtn" onclick="toggleTimer()">
                    <span>⏱️</span>
                    <span id="testTimerStatus">Έναρξη</span>
                </button>
                <span class="lightbox-timer-display" id="testTimerDisplay">2:00</span>
            </div>
        </div>
    </div>

    <script>
        // Απλοποιημένες συναρτήσεις για τη δοκιμή
        let metronomeInterval = null;
        let timerInterval = null;
        let timerSeconds = 120;
        let isMetronomeActive = false;
        let isTimerActive = false;

        function openLightbox() {
            document.getElementById('testLightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('testLightbox').style.display = 'none';
            document.body.style.overflow = '';
            stopMetronome();
            stopTimer();
        }

        function switchCard(card) {
            const img = document.getElementById('testLightboxImage');
            const tabs = document.querySelectorAll('.lightbox-tab');
            const metronomeGroup = document.getElementById('testMetronomeGroup');
            const timerGroup = document.getElementById('testTimerGroup');

            if (card === 'cpr') {
                img.src = 'cpr-card.png';
                img.alt = 'ΚΑΡΠΑ';
                metronomeGroup.style.display = 'flex';
                timerGroup.style.display = 'none';
                tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.card === 'cpr'));
            } else {
                img.src = 'aed-card.png';
                img.alt = 'AED';
                metronomeGroup.style.display = 'none';
                timerGroup.style.display = 'flex';
                tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.card === 'aed'));
            }
        }

        function makeCall() {
            alert('Κλήση στο 166 ή 112');
        }

        function toggleMetronome() {
            if (isMetronomeActive) {
                stopMetronome();
            } else {
                startMetronome();
            }
        }

        function startMetronome() {
            const btn = document.getElementById('testMetronomeBtn');
            const status = document.getElementById('testMetronomeStatus');
            const indicator = document.getElementById('testPulseIndicator');
            btn.classList.add('active');
            status.textContent = 'Διακοπή';
            indicator.classList.add('active');
            isMetronomeActive = true;
            const interval = 545;
            metronomeInterval = setInterval(() => {
                indicator.style.background = indicator.style.background === '#dc2626' ? '#94a3b8' : '#dc2626';
            }, interval);
        }

        function stopMetronome() {
            if (metronomeInterval) {
                clearInterval(metronomeInterval);
                metronomeInterval = null;
            }
            const btn = document.getElementById('testMetronomeBtn');
            const status = document.getElementById('testMetronomeStatus');
            const indicator = document.getElementById('testPulseIndicator');
            btn.classList.remove('active');
            status.textContent = 'Έναρξη';
            indicator.classList.remove('active');
            indicator.style.background = '#94a3b8';
            isMetronomeActive = false;
        }

        function toggleTimer() {
            if (isTimerActive) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            timerSeconds = 120;
            const btn = document.getElementById('testTimerBtn');
            const status = document.getElementById('testTimerStatus');
            const display = document.getElementById('testTimerDisplay');
            btn.classList.add('active');
            status.textContent = 'Διακοπή';
            isTimerActive = true;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();
                if (timerSeconds <= 0) {
                    stopTimer();
                    alert('Ολοκληρώθηκε ο κύκλος των 2 λεπτών!');
                    display.style.color = '#dc2626';
                    setTimeout(() => { display.style.color = ''; }, 3000);
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const btn = document.getElementById('testTimerBtn');
            const status = document.getElementById('testTimerStatus');
            btn.classList.remove('active');
            status.textContent = 'Έναρξη';
            isTimerActive = false;
            timerSeconds = 120;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const display = document.getElementById('testTimerDisplay');
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            display.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Κλείσιμο με Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
        });

        document.getElementById('testLightbox').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLightbox();
        });
    </script>

</body>
</html>
