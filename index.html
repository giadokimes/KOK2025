<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="description" content="Ο Κώδικας Οδικής Κυκλοφορίας στην τσέπη σου — αναφορά παραβάσεων, προστίμων και κυρώσεων για την Ελληνική Τροχαία.">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="favicon-v2.ico" type="image/x-icon">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ΚΟΚ Τσέπης">
    <meta name="theme-color" content="#1a365d">
    <title>ΚΟΚ – Τσέπης v21 (PWA)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-top">
        <div class="header-logo-wrapper">
            <img src="logo-48-v2.png" alt="ΚΟΚ Τσέπης" class="header-logo">
            <div class="header-title">ΚΟΚ <span>Τσέπης v21</span></div>
        </div>
        <div class="header-actions">
            <button onclick="toggleDark()" title="Σκοτεινή λειτουργία" id="darkModeBtn"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            <button onclick="toggleFavorites()" title="Αγαπημένα"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2.5 15.1 8.9 22.1 9.9 17.1 14.8 18.3 21.8 12 18.4 5.7 21.8 6.9 14.8 1.9 9.9 8.9 8.9"/></svg></button>
            <button class="pdf-btn" onclick="exportFavorites()" title="Εξαγωγή PDF"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg><span>PDF</span></button>
            <button onclick="window.print()" title="Εκτύπωση"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
            <button id="installBtn" onclick="installApp()"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Εγκατάσταση</span></button>
        </div>
    </div>
    <div class="search-box">
        <span class="icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" id="searchInput" placeholder="Αναζήτηση παράβασης..." oninput="onSearch()">
        <button class="clear-btn" id="clearBtn" onclick="clearSearch()"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="ota-search-box" id="otaSearchBox">
        <label><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="21" x2="21" y2="21"/><path d="M5 21V7l7-4 7 4v14"/><line x1="9" y1="9" x2="9" y2="9.01"/><line x1="15" y1="9" x2="15" y2="9.01"/><line x1="9" y1="13" x2="9" y2="13.01"/><line x1="15" y1="13" x2="15" y2="13.01"/><line x1="9" y1="17" x2="9" y2="17.01"/><line x1="15" y1="17" x2="15" y2="17.01"/></svg> Κωδικός ΟΤΑ:</label>
        <input type="text" id="otaSearchInput" placeholder="Αναζήτησε δήμο..." oninput="onOtaSearch()" autocomplete="off">
        <button id="geoBtn" class="geo-btn" onclick="detectLocation()" title="Εντοπισμός τρέχουσας τοποθεσίας"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
        <span class="ota-code-display" id="otaCodeDisplay">—</span>
        <div class="ota-suggestions" id="otaSuggestions"></div>
    </div>
    <div class="filters" id="filterContainer">
        <button data-filter="στάθμευση" onclick="setFilter('στάθμευση')">Στάθμευση</button>
        <button data-filter="κίνηση" onclick="setFilter('κίνηση')">Κίνηση</button>
        <button data-filter="σήμανση" onclick="setFilter('σήμανση')">Σήμανση</button>
        <button data-filter="ταχύτητα" onclick="setFilter('ταχύτητα')">Ταχύτητα</button>
        <div class="filter-divider"></div>
        <button data-filter="ασφάλεια" onclick="setFilter('ασφάλεια')">Ασφάλεια</button>
        <button data-filter="έγγραφα" onclick="setFilter('έγγραφα')">Έγγραφα</button>
        <button data-filter="φορτηγά" onclick="setFilter('φορτηγά')">Φορτηγά</button>
        <div class="filter-divider"></div>
        <button data-filter="δίκυκλα" onclick="setFilter('δίκυκλα')">Δίκυκλα</button>
        <button data-filter="ΕΠΗΟ" onclick="setFilter('ΕΠΗΟ')">ΕΠΗΟ</button>
        <button data-filter="επαγγελματικά" onclick="setFilter('επαγγελματικά')">Επαγγελματικά</button>
        <button data-filter="αλκοόλ" onclick="setFilter('αλκοόλ')">Αλκοόλ</button>
        <button data-filter="υποτροπή" onclick="setFilter('υποτροπή')">Υποτροπή</button>
    </div>
</div>

<div class="count" id="countDisplay">
    <span id="countText">0 παραβάσεις</span>
    <span id="favIndicator" style="display:none;"><svg class="icon-svg icon-inline" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2.5 15.1 8.9 22.1 9.9 17.1 14.8 18.3 21.8 12 18.4 5.7 21.8 6.9 14.8 1.9 9.9 8.9 8.9"/></svg> Αγαπημένα (<span id="favCount">0</span>)</span>
</div>

<div class="list" id="listContainer"></div>

<!-- Copyright Footer -->
<div style="text-align: center; padding: 20px 15px 10px 15px; font-size: 13px; color: #94a3b8; border-top: 1px solid rgba(0, 0, 0, 0.06); margin-top: 20px;">
    <p>© 2026 Siakos Filaretos . All rights reserved.</p>
    <p style="font-size: 11px; color: #cbd5e1; margin-top: 4px;">
        Εφαρμογή ΚΟΚ Τσέπης v21 — Πνευματική Ιδιοκτησία
    </p>
</div>

<div class="toast" id="toast"></div>

<div class="install-banner" id="installBanner">
    <span><svg class="icon-svg icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Εγκαταστήστε την εφαρμογή</span>
    <div>
        <button onclick="installApp()">Εγκατάσταση</button>
        <button class="close-btn" onclick="dismissInstallBanner()"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
</div>

<!-- Modal προβολής πινακίδας -->
<div id="signModal">
    <div class="modal-box">
        <img id="modalSignImg" src="" alt="Πινακίδα">
        <h3 id="modalSignName"></h3>
        <div class="modal-details" id="modalSignDetails"></div>
        <button class="close-modal-btn" onclick="closeSignModal()"><svg class="icon-svg icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Κλείσιμο</button>
    </div>
</div>

<!-- Selection Footer -->
<div class="selection-footer" id="selectionFooter">
    <div class="info">
        <span class="count" id="selectedCount">0</span>
        <span>παραβάσεις επιλέχθηκαν</span>
        <span class="names" id="selectedNames"></span>
    </div>
    <div class="actions">
        <button class="clear-btn" onclick="clearSelection()"><svg class="icon-svg icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Καθαρισμός</button>
        <button class="pdf-btn" onclick="exportSelectedToPDF()"><svg class="icon-svg icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg> PDF κλήσης</button>
    </div>
</div>

<!-- Scripts -->
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="signs.js"></script>
<script src="ota.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
