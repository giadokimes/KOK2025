<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="favicon-v2.png" type="image/png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ΚΟΚ Τσέπης">
    <meta name="theme-color" content="#1a365d">
    <title>ΚΟΚ – Τσέπης v22 (PWA)</title>
    <!-- Font Awesome 6 (γραμμικά εικονίδια) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-top">
        <div class="header-logo-wrapper">
            <img src="logo-48-v2.png" alt="ΚΟΚ Τσέπης" class="header-logo">
            <div class="header-title">ΚΟΚ <span>Τσέπης v22</span></div>
        </div>
        <div class="header-actions">
            <button onclick="toggleDark()" title="Σκοτεινή λειτουργία">
                <i class="fa-regular fa-moon"></i>
            </button>
            <button onclick="toggleFavorites()" title="Αγαπημένα">
                <i class="fa-regular fa-star" id="favIcon"></i>
            </button>
            <button class="pdf-btn" onclick="exportFavorites()" title="Εξαγωγή PDF">
                <i class="fa-regular fa-file-pdf"></i> PDF
            </button>
            <button onclick="window.print()" title="Εκτύπωση">
                <i class="fa-regular fa-print"></i>
            </button>
            <button id="installBtn" onclick="installApp()">
                <i class="fa-regular fa-download"></i> Εγκατάσταση
            </button>
        </div>
    </div>
    <div class="search-box">
        <span class="icon"><i class="fa-regular fa-search"></i></span>
        <input type="text" id="searchInput" placeholder="Αναζήτηση παράβασης..." oninput="onSearch()">
        <button class="clear-btn" id="clearBtn" onclick="clearSearch()">
            <i class="fa-regular fa-xmark"></i>
        </button>
    </div>
    <div class="ota-search-box" id="otaSearchBox">
        <label><i class="fa-regular fa-city"></i> Κωδικός ΟΤΑ:</label>
        <input type="text" id="otaSearchInput" placeholder="Αναζήτησε δήμο..." oninput="onOtaSearch()" autocomplete="off">
        <span class="ota-code-display" id="otaCodeDisplay">—</span>
        <div class="ota-suggestions" id="otaSuggestions"></div>
    </div>
    <!-- ΝΕΟ: Διεύθυνση τοποθεσίας -->
    <div class="location-address" id="locationAddress">
        <i class="fa-regular fa-location-dot"></i>
        <span id="addressText">Αναζήτηση τοποθεσίας...</span>
    </div>
    <div class="filters" id="filterContainer">
        <button data-filter="στάθμευση" onclick="setFilter('στάθμευση')">
            <i class="fa-regular fa-parking"></i> Στάθμευση
        </button>
        <button data-filter="κίνηση" onclick="setFilter('κίνηση')">
            <i class="fa-regular fa-car"></i> Κίνηση
        </button>
        <button data-filter="σήμανση" onclick="setFilter('σήμανση')">
            <i class="fa-regular fa-signs-post"></i> Σήμανση
        </button>
        <button data-filter="ταχύτητα" onclick="setFilter('ταχύτητα')">
            <i class="fa-regular fa-gauge-high"></i> Ταχύτητα
        </button>
        <div class="filter-divider"></div>
        <button data-filter="ασφάλεια" onclick="setFilter('ασφάλεια')">
            <i class="fa-regular fa-shield"></i> Ασφάλεια
        </button>
        <button data-filter="έγγραφα" onclick="setFilter('έγγραφα')">
            <i class="fa-regular fa-file-lines"></i> Έγγραφα
        </button>
        <button data-filter="φορτηγά" onclick="setFilter('φορτηγά')">
            <i class="fa-regular fa-truck"></i> Φορτηγά
        </button>
        <div class="filter-divider"></div>
        <button data-filter="δίκυκλα" onclick="setFilter('δίκυκλα')">
            <i class="fa-regular fa-motorcycle"></i> Δίκυκλα
        </button>
        <button data-filter="ΕΠΗΟ" onclick="setFilter('ΕΠΗΟ')">
            <i class="fa-regular fa-scooter"></i> ΕΠΗΟ
        </button>
        <button data-filter="επαγγελματικά" onclick="setFilter('επαγγελματικά')">
            <i class="fa-regular fa-briefcase"></i> Επαγγελματικά
        </button>
        <button data-filter="αλκοόλ" onclick="setFilter('αλκοόλ')">
            <i class="fa-regular fa-wine-bottle"></i> Αλκοόλ
        </button>
        <button data-filter="υποτροπή" onclick="setFilter('υποτροπή')">
            <i class="fa-regular fa-rotate-left"></i> Υποτροπή
        </button>
    </div>
</div>

<div class="count" id="countDisplay">
    <span id="countText">0 παραβάσεις</span>
    <span id="favIndicator" style="display:none;">
        <i class="fa-regular fa-star"></i> Αγαπημένα (<span id="favCount">0</span>)
    </span>
</div>

<div class="list" id="listContainer"></div>

<!-- Copyright Footer -->
<div style="text-align: center; padding: 20px 15px 10px 15px; font-size: 13px; color: #94a3b8; border-top: 1px solid rgba(0, 0, 0, 0.06); margin-top: 20px;">
    <p>© 2026 Siakos Filaretos . All rights reserved.</p>
    <p style="font-size: 11px; color: #cbd5e1; margin-top: 4px;">
        Εφαρμογή ΚΟΚ Τσέπης v22 — Πνευματική Ιδιοκτησία
    </p>
</div>

<div class="toast" id="toast"></div>

<div class="install-banner" id="installBanner">
    <span><i class="fa-regular fa-download"></i> Εγκαταστήστε την εφαρμογή</span>
    <div>
        <button onclick="installApp()">Εγκατάσταση</button>
        <button class="close-btn" onclick="dismissInstallBanner()">
            <i class="fa-regular fa-xmark"></i>
        </button>
    </div>
</div>

<!-- Modal προβολής πινακίδας -->
<div id="signModal">
    <div class="modal-box">
        <img id="modalSignImg" src="" alt="Πινακίδα">
        <h3 id="modalSignName"></h3>
        <div class="modal-details" id="modalSignDetails"></div>
        <button class="close-modal-btn" onclick="closeSignModal()">
            <i class="fa-regular fa-xmark"></i> Κλείσιμο
        </button>
    </div>
</div>

<!-- Selection Footer -->
<div class="selection-footer" id="selectionFooter">
    <div class="info">
        <span class="count" id="selectedCount">0</span>
        <span>παραβάσεις επιλέχθηκαν</span>
        <span class="names" id="selectedNames"></span>
    </div>
    <div class="actions">
        <button class="clear-btn" onclick="clearSelection()">
            <i class="fa-regular fa-eraser"></i> Καθαρισμός
        </button>
        <button class="pdf-btn" onclick="exportSelectedToPDF()">
            <i class="fa-regular fa-file-pdf"></i> PDF κλήσης
        </button>
    </div>
</div>

<!-- Scripts -->
<script src="data.js"></script>
<script src="signs.js"></script>
<script src="ota.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
