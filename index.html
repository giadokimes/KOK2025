            color: #e2e8f0;
        }
        .header {

        body.dark .header {
            background: #0b1e33;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-title span {
            font-weight: 300;
            font-size: 14px;
            opacity: 0.8;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header-actions button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }
        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        body.dark .header-actions button {
            background: rgba(255, 255, 255, 0.08);
        }
        .search-box {
            margin-top: 12px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a202c;
            outline: none;
        }
        body.dark .search-box input {
            background: #1e293b;
            color: #e2e8f0;
        }
        .search-box input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }
        .search-box .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        .filters button {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .filters button.active {
            background: #fff;
            color: #1e3a5f;
        }
        body.dark .filters button.active {
            background: #2d3748;
            color: #e2e8f0;
        }
        .filters button:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        body.dark .filters button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

            font-size: 14px;
            color: #4a5568;
            padding: 8px 4px 0 4px;

            justify-content: space-between;
            align-items: center;
        }
        body.dark .count {
            color: #94a3b8;
        }

            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #e2e8f0;
            display: flex;
            gap: 14px;
            align-items: flex-start;

        body.dark .card {
            background: #1e293b;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            border-left-color: #334155;
        }

            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card .sign svg {
            max-width: 60px;
            max-height: 60px;
        }
        .card .content {
            flex: 1;

        .card .name {

            font-size: 15px;
            line-height: 1.3;
        }

            color: #4a5568;

        }
        body.dark .card .article {
            color: #94a3b8;
        }

            gap: 8px 18px;
            margin-top: 6px;
            font-size: 14px;
        }
        .card .details .fine {
            font-weight: 600;

        }

        }
        .card .details .suspend {

            font-weight: 500;
        }

            color: #60a5fa;
        }

            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: #b45309;
            background: #ffedd5;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 6px;

            color: #fdba74;

            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            opacity: 0.3;
            transition: opacity .2s, transform .15s;
            line-height: 1;

            left: 50%;
            transform: translateX(-50%);
            background: #1a202c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            z-index: 999;
        }
        body.dark .toast {
            background: #e2e8f0;
            color: #0f172a;
        }
        .toast.show {
            opacity: 1;
        }

            p1: `<svg viewBox="0 0 100 100"><polygon points="50,5 95,50 50,95 5,50" fill="#fff" stroke="#cc0000" stroke-width="4"/><polygon points="50,20 80,50 50,80 20,50" fill="#fff" stroke="#cc0000" stroke-width="4"/><polygon points="50,30 70,50 50,70 30,50" fill="#cc0000"/></svg>`,
            r29: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#0047ab" stroke="#fff" stroke-width="3"/><circle cx="50" cy="50" r="40" fill="none" stroke="#cc0000" stroke-width="6"/><path d="M30,25 L70,75 M70,25 L30,75" stroke="#cc0000" stroke-width="6"/></svg>`,
            disabled: `<svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="#0047ab" rx="8"/><circle cx="50" cy="40" r="14" fill="#fff"/><rect x="36" y="52" width="28" height="32" fill="#fff" rx="3"/><circle cx="50" cy="76" r="10" fill="#fff"/></svg>`,
            crosswalk: `<svg viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" fill="#2d3748" rx="8"/><line x1="10" y1="30" x2="90" y2="30" stroke="#fff" stroke-width="6"/><line x1="10" y1="50" x2="90" y2="50" stroke="#fff" stroke-width="6"/><line x1="10" y1="70" x2="90" y2="70" stroke="#fff" stroke-width="6"/><circle cx="50" cy="50" r="25" fill="#fff"/><circle cx="50" cy="50" r="18" fill="#2d3748"/></svg>`
        };

        // ============================================================
        // ΚΑΤΑΣΤΑΣΗ & ΣΥΝΑΡΤΗΣΕΙΣ
        // ============================================================
        let currentFilter = 'all';
        let showFavorites = false;
        let favorites = JSON.parse(localStorage.getItem('kok_favorites_v5')) || {};

        function toggleDark() {
            document.body.classList.toggle('dark');
        }

        function toggleFavorites() {
            showFavorites = !showFavorites;
            document.getElementById('favIndicator').style.display = showFavorites ? 'inline' : 'none';
            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
            render();
        }

        function toggleFavorite(id) {
            favorites[id] = !favorites[id];
            localStorage.setItem('kok_favorites_v5', JSON.stringify(favorites));
            render();
            showToast(favorites[id] ? '⭐ Προστέθηκε στα αγαπημένα' : '⭐ Αφαιρέθηκε από τα αγαπημένα');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function getSignHTML(sign) {
            return signs[sign] ? `<div class="sign">${signs[sign]}</div>` : '';
        }

        function getCardColor(category) {
            const map = {
                'στάθμευση': '#f59e0b',
                'κίνηση': '#ef4444',
                'άδειες': '#8b5cf6',
                'ασφάλεια': '#10b981',
                'θόρυβος': '#f97316',
                'ΕΠΗΟ': '#06b6d4',
                'ειδικές': '#dc2626'
            };
            return map[category] || '#64748b';
        }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('listContainer');
            const countEl = document.getElementById('countText');

            let filtered = data.filter(v => {
                if (showFavorites && !favorites[v.id]) return false;
                if (currentFilter !== 'all' && v.category !== currentFilter) return false;
                if (query) {
                    const searchable = (v.name + ' ' + v.article + ' ' + v.category + ' ' + v.suspend).toLowerCase();
                    if (!searchable.includes(query)) return false;
                }
                return true;
            });

            countEl.textContent = filtered.length + ' παραβάσεις';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty">🔍 Δεν βρέθηκαν παραβάσεις<br><span style="font-size:14px;">Δοκίμασε άλλη λέξη-κλειδί</span></div>`;
                return;
            }

            container.innerHTML = filtered.map(v => `
                <div class="card" style="border-left-color: ${getCardColor(v.category)};">
                    ${v.sign ? getSignHTML(v.sign) : ''}
                    <div class="content">
                        <div class="name">
                            ${v.name}
                            ${v.half ? '<span class="badge-half">½ για μοτοσικλέτα</span>' : ''}
                            ${v.criminal ? '<span class="badge-criminal">ΠΛΗΜΜΕΛΗΜΑ</span>' : ''}
                        </div>
                        <div class="article">Άρθρο: ${v.article}</div>
                        <div class="details">
                            <span class="fine">💰 ${typeof v.fine === 'number' ? v.fine + '€' : v.fine}</span>
                            ${v.suspend !== '-' ? `<span class="suspend">⛔ ${v.suspend}</span>` : ''}
                        </div>
                    </div>
                    <button class="favorite ${favorites[v.id] ? 'active' : ''}" onclick="toggleFavorite(${v.id})">
                        ${favorites[v.id] ? '⭐' : '☆'}
                    </button>
                </div>
            `).join('');
        }

        render();

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
        });
    </script>
</body>
</html>
