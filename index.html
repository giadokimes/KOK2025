            background: #f0f4f8;
            color: #1a202c;
            padding: 0 0 80px 0;
            min-height: 100vh;

        }
        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }
        .header {
            background: #1e3a5f;
            color: #fff;

            top: 0;

            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }
        body.dark .header {
            background: #0b1e33;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-title span {
            font-weight: 300;
            font-size: 14px;
            opacity: 0.8;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header-actions button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }
        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        body.dark .header-actions button {
            background: rgba(255, 255, 255, 0.08);
        }
        .search-box {
            margin-top: 12px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a202c;
            outline: none;
        }
        body.dark .search-box input {
            background: #1e293b;
            color: #e2e8f0;
        }
        .search-box input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }
        .search-box .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
        }
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        .filters button {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .filters button.active {
            background: #fff;
            color: #1e3a5f;
        }
        body.dark .filters button.active {
            background: #2d3748;
            color: #e2e8f0;
        }
        .filters button:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        body.dark .filters button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

            font-size: 14px;
            color: #4a5568;
            padding: 8px 4px 0 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.dark .count {
            color: #94a3b8;
        }
        .list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
            border-left: 5px solid #e2e8f0;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        body.dark .card {
            background: #1e293b;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            border-left-color: #334155;
        }
        .card .sign {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card .sign svg {
            max-width: 60px;
            max-height: 60px;
        }
        .card .content {
            flex: 1;
            min-width: 0;
        }
        .card .name {
            font-weight: 600;
            font-size: 15px;
            line-height: 1.3;
        }
        .card .article {
            font-size: 13px;
            color: #4a5568;
            margin-top: 2px;
        }
        body.dark .card .article {
            color: #94a3b8;

            margin-left: 6px;

            background: #450a0a;
            color: #fca5a5;
        }

            font-weight: 700;
            color: #b45309;
            background: #ffedd5;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 6px;

            background: #451a03;
            color: #fdba74;
        }

            display: inline-block;

            font-weight: 700;

            background: #dbeafe;

            background: #1e3a5f;

            color: #64748b;
            font-size: 16px;
        }
        body.dark .empty {
            color: #94a3b8;
        }

            left: 50%;

            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;

            color: #0f172a;
        }

                'ΕΠΗΟ': '#06b6d4',
                'άδειες': '#8b5cf6',
                'ασφάλεια': '#10b981',
                'μέθη': '#dc2626',
                'ειδικές': '#dc2626',
                'λοιπές': '#64748b'
            };
            return map[category] || '#64748b';
        }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('listContainer');
            const countEl = document.getElementById('countText');

            let filtered = data.filter(v => {
                if (showFavorites && !favorites[v.id]) return false;
                if (currentFilter !== 'all' && v.category !== currentFilter) return false;
                if (query) {
                    const searchable = (v.name + ' ' + v.article + ' ' + v.category + ' ' + v.suspend).toLowerCase();
                    if (!searchable.includes(query)) return false;
                }
                return true;
            });

            countEl.textContent = filtered.length + ' παραβάσεις';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty">🔍 Δεν βρέθηκαν παραβάσεις<br><span style="font-size:14px;">Δοκίμασε άλλη λέξη-κλειδί</span></div>`;
                return;
            }

            container.innerHTML = filtered.map(v => {
                const signKey = v.id === 39 ? 'stop' :
                    v.id === 38 ? 'r40' :
                    v.id === 40 ? 'p1' :
                    v.id === 43 ? 'r29' :
                    v.id === 2 ? 'disabled' :
                    v.id === 1 ? 'crosswalk' : null;

                const isPro = v.category === 'φορτηγά' || v.id === 103 || v.id === 104 || v.id === 105 || v.id === 106;

                return `
                <div class="card" style="border-left-color: ${getCardColor(v.category)};">
                    ${signKey ? getSignHTML(signKey) : ''}
                    <div class="content">
                        <div class="name">
                            ${v.name}
                            ${v.half ? '<span class="badge-half">½ για μοτοσικλέτα</span>' : ''}
                            ${v.criminal ? '<span class="badge-criminal">ΠΛΗΜΜΕΛΗΜΑ</span>' : ''}
                            ${isPro ? '<span class="badge-pro">Επαγγελματικό</span>' : ''}
                        </div>
                        <div class="article">Άρθρο: ${v.article}</div>
                        <div class="details">
                            <span class="fine">💰 ${v.fine}</span>
                            ${v.suspend !== '-' ? `<span class="suspend">⛔ ${v.suspend}</span>` : ''}
                            ${v.seco > 0 ? `<span class="seco">📊 ${v.seco} βαθμοί ΣΕΣΟ</span>` : ''}
                        </div>
                    </div>
                    <button class="favorite ${favorites[v.id] ? 'active' : ''}" onclick="toggleFavorite(${v.id})">
                        ${favorites[v.id] ? '⭐' : '☆'}
                    </button>
                </div>
            `}).join('');
        }

        render();

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
        });
    </script>
</body>
</html>
