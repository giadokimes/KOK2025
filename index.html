        }
        .header {

        }
        .header-title {

            letter-spacing: 0.5px;
        }
        .header-title span {
            font-weight: 300;
            font-size: 14px;
            opacity: 0.8;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .header-actions button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .2s;
        }
        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        body.dark .header-actions button {
            background: rgba(255, 255, 255, 0.08);
        }
        .search-box {
            margin-top: 12px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a202c;
            outline: none;
        }
        body.dark .search-box input {
            background: #1e293b;
            color: #e2e8f0;
        }
        .search-box input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }
        .search-box .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);

            opacity: 0.6;
        }

            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .filters button {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .filters button.active {
            background: #fff;
            color: #1e3a5f;
        }
        body.dark .filters button.active {
            background: #2d3748;
            color: #e2e8f0;
        }
        .filters button:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        body.dark .filters button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

            align-items: center;
        }
        body.dark .count {
            color: #94a3b8;
        }

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

            gap: 14px;
            align-items: flex-start;

        }

            height: 60px;

            align-items: center;
            justify-content: center;
        }

        }

            font-size: 15px;
            line-height: 1.3;
        }

            color: #4a5568;

        }
        body.dark .card .article {
            color: #94a3b8;
        }

        }
        .card .details .points {

        }

            color: #a78bfa;
        }

            cursor: pointer;
            padding: 4px;
            opacity: 0.3;
            transition: opacity .2s, transform .15s;
            line-height: 1;
        }
        .card .favorite.active {
            opacity: 1;
            color: #f59e0b;
        }
        .card .favorite:active {

        }
        body.dark .card .favorite {

        body.dark .card .favorite.active {

            color: #fbbf24;
        }

            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a202c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            z-index: 999;
        }
        body.dark .toast {
            background: #e2e8f0;
            color: #0f172a;
        }

                background: #fee !important;

        const signs = {

        };

        // ============================================================
        // ΚΑΤΑΣΤΑΣΗ & ΣΥΝΑΡΤΗΣΕΙΣ
        // ============================================================
        let currentFilter = 'all';
        let showFavorites = false;
        let favorites = JSON.parse(localStorage.getItem('kok_favorites')) || {};

        function toggleDark() {
            document.body.classList.toggle('dark');
        }

        function toggleFavorites() {
            showFavorites = !showFavorites;
            document.getElementById('favIndicator').style.display = showFavorites ? 'inline' : 'none';
            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
            render();
        }

        function toggleFavorite(id) {
            favorites[id] = !favorites[id];
            localStorage.setItem('kok_favorites', JSON.stringify(favorites));
            render();
            showToast(favorites[id] ? '⭐ Προστέθηκε στα αγαπημένα' : '⭐ Αφαιρέθηκε από τα αγαπημένα');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function getSignHTML(sign) {
            return signs[sign] ? `<div class="sign">${signs[sign]}</div>` : '';
        }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('listContainer');
            const countEl = document.getElementById('countText');

            let filtered = data.filter(v => {
                if (showFavorites && !favorites[v.id]) return false;
                if (currentFilter !== 'all' && v.category !== currentFilter) return false;
                if (query) {
                    const searchable = (v.name + ' ' + v.article + ' ' + v.category + ' ' + v.details).toLowerCase();
                    if (!searchable.includes(query)) return false;
                }
                return true;
            });

            countEl.textContent = filtered.length + ' παραβάσεις';

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty">🔍 Δεν βρέθηκαν παραβάσεις<br><span style="font-size:14px;">Δοκίμασε άλλη λέξη-κλειδί</span></div>`;
                return;
            }

            container.innerHTML = filtered.map(v => `
                <div class="card" style="border-left-color: ${v.category === 'στάθμευση' ? '#f59e0b' : v.category === 'πινακίδες' ? '#3b82f6' : v.category === 'κίνηση' ? '#ef4444' : v.category === 'άδειες' ? '#8b5cf6' : v.category === 'ασφάλεια' ? '#10b981' : v.category === 'θόρυβος' ? '#f97316' : '#64748b'};">
                    ${v.sign ? getSignHTML(v.sign) : ''}
                    <div class="content">
                        <div class="name">
                            ${v.name}
                            ${v.criminal ? '<span class="badge-criminal">ΠΛΗΜΜΕΛΗΜΑ</span>' : ''}
                        </div>
                        <div class="article">Άρθρο: ${v.article}</div>
                        <div class="details">
                            <span class="fine">💰 ${typeof v.fine === 'number' ? v.fine + '€' : v.fine}</span>
                            <span class="suspend">⛔ ${v.suspend}</span>
                            ${v.points > 0 ? `<span class="points">📊 ${v.points} βαθμοί</span>` : ''}
                        </div>
                        <div style="font-size: 12px; color: #4a5568; margin-top: 4px; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; display: inline-block;">
                            📌 ${v.details}
                        </div>
                    </div>
                    <button class="favorite ${favorites[v.id] ? 'active' : ''}" onclick="toggleFavorite(${v.id})">
                        ${favorites[v.id] ? '⭐' : '☆'}
                    </button>
                </div>
            `).join('');
        }

        render();

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
        });
    </script>
