<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ΚΟΚ – Τσέπης v10.4</title>
    <style>
        /* ============================================================
               v10.4 - Αναγνώσιμα χρώματα βαρύτητας
                     - Παστέλ αποχρώσεις + χρωματική λωρίδα
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fb;
            color: #1a202c;
            padding: 0 0 80px 0;
            min-height: 100vh;
            transition: background .3s, color .3s;
            line-height: 1.5;
        }

        body.dark {
            background: #0d1524;
            color: #e2e8f0;
        }

        /* ----- Header ----- */
        .header {
            background: linear-gradient(145deg, #1a365d, #1e3a5f);
            color: #fff;
            padding: 16px 20px 14px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        body.dark .header {
            background: linear-gradient(145deg, #0b1e33, #0f2847);
            border-bottom-color: rgba(255, 255, 255, 0.02);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-title {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-title span {
            font-weight: 300;
            font-size: 14px;
            opacity: 0.7;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-actions button {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .header-actions .pdf-btn {
            font-size: 13px;
            font-weight: 600;
            padding: 0 16px;
            border-radius: 30px;
            width: auto;
            gap: 6px;
            background: #10b981;
            color: #fff;
        }

        .header-actions .pdf-btn:hover {
            background: #059669;
            transform: scale(1.02);
        }

        body.dark .header-actions button {
            background: rgba(255, 255, 255, 0.08);
        }

        body.dark .header-actions .pdf-btn {
            background: #10b981;
        }

        /* ----- Search Box ----- */
        .search-box {
            margin-top: 14px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 48px 14px 48px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.95);
            color: #1a202c;
            outline: none;
            transition: all .2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        body.dark .search-box input {
            background: #1e293b;
            color: #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .search-box input:focus {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.25), 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        .search-box .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.5;
        }

        .search-box .clear-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 18px;
            color: #94a3b8;
            cursor: pointer;
            display: none;
            padding: 4px;
            transition: color .2s;
        }

        .search-box .clear-btn:hover {
            color: #ef4444;
        }

        .search-box .clear-btn.visible {
            display: block;
        }

        /* ----- Filters ----- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .filters button {
            padding: 7px 16px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
            position: relative;
        }

        .filters button.active {
            background: #fff;
            color: #1e3a5f;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .filters button.active::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 30%;
            width: 40%;
            height: 2px;
            background: #1e3a5f;
            border-radius: 4px;
        }

        body.dark .filters button.active {
            background: #2d3748;
            color: #e2e8f0;
        }

        body.dark .filters button.active::after {
            background: #e2e8f0;
        }

        .filters button:hover {
            background: rgba(255, 255, 255, 0.32);
            transform: translateY(-1px);
        }

        body.dark .filters button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ----- Count ----- */
        .count {
            font-size: 14px;
            color: #4a5568;
            padding: 12px 4px 4px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }

        body.dark .count {
            color: #94a3b8;
        }

        .count .fav-count {
            font-weight: 600;
            color: #f59e0b;
        }

        /* ----- Cards (με παστέλ φόντο και χρωματική λωρίδα) ----- */
        .list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card {
            padding: 16px 18px;
            border-radius: 14px;
            border-left: 6px solid #e2e8f0;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            transition: all .15s;
            background-color: #ffffff;
            box-shadow: none;
            position: relative;
        }

        body.dark .card {
            border-left-color: #334155;
        }

        .card:hover {
            transform: translateY(-1px);
            filter: brightness(0.97);
        }

        body.dark .card:hover {
            filter: brightness(1.1);
        }

        /* Χρωματική λωρίδα βαρύτητας */
        .card .severity-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            border-radius: 14px 14px 0 0;
            opacity: 0.8;
        }

        body.dark .card .severity-bar {
            opacity: 0.6;
        }

        .card .content {
            flex: 1;
            min-width: 0;
            margin-top: 2px;
        }

        .card .name {
            font-weight: 600;
            font-size: 16px;
            line-height: 1.4;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            color: #0f172a;
        }

        body.dark .card .name {
            color: #f1f5f9;
        }

        .card .article {
            font-size: 13px;
            color: #64748b;
            margin-top: 2px;
            font-weight: 500;
        }

        body.dark .card .article {
            color: #94a3b8;
        }

        .card .details {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            margin-top: 8px;
            font-size: 15px;
            align-items: center;
        }

        .card .details .fine {
            font-weight: 700;
            color: #dc2626;
        }

        body.dark .card .details .fine {
            color: #f87171;
        }

        .card .details .suspend {
            color: #2563eb;
            font-weight: 600;
        }

        body.dark .card .details .suspend {
            color: #60a5fa;
        }

        .card .details .points {
            color: #7c3aed;
            font-weight: 600;
        }

        body.dark .card .details .points {
            color: #a78bfa;
        }

        .card .favorite {
            flex-shrink: 0;
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            padding: 4px;
            opacity: 0.25;
            transition: all .2s;
            line-height: 1;
            margin-top: -2px;
        }

        .card .favorite.active {
            opacity: 1;
            color: #f59e0b;
        }

        .card .favorite:active {
            transform: scale(1.3);
        }

        body.dark .card .favorite {
            opacity: 0.3;
        }

        body.dark .card .favorite.active {
            opacity: 1;
            color: #fbbf24;
        }

        /* ----- Badges ----- */
        .badge-criminal {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: #dc2626;
            background: rgba(220, 38, 38, 0.15);
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        body.dark .badge-criminal {
            background: rgba(252, 165, 165, 0.2);
            color: #fca5a5;
        }

        .badge-half {
            display: inline-block;
            font-size: 11px;
            color: #64748b;
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 4px;
            font-weight: 500;
        }

        body.dark .badge-half {
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
        }

        /* ----- Description Toggle ----- */
        .card .desc-toggle {
            background: none;
            border: none;
            color: #3b82f6;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 0;
            margin-top: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color .2s;
        }

        body.dark .card .desc-toggle {
            color: #60a5fa;
        }

        .card .desc-toggle:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        body.dark .card .desc-toggle:hover {
            color: #93c5fd;
        }

        .card .full-description {
            display: none;
            font-size: 14px;
            color: #334155;
            background: rgba(0, 0, 0, 0.04);
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 10px;
            line-height: 1.6;
            border-left: 4px solid #3b82f6;
        }

        body.dark .card .full-description {
            background: rgba(255, 255, 255, 0.06);
            color: #e2e8f0;
            border-left-color: #60a5fa;
        }

        .card .full-description.open {
            display: block;
        }

        /* ----- Empty State ----- */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 16px;
        }

        body.dark .empty {
            color: #94a3b8;
        }

        .empty .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        /* ----- Toast ----- */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a202c;
            color: #fff;
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        body.dark .toast {
            background: #e2e8f0;
            color: #0f172a;
        }

        .toast.show {
            opacity: 1;
        }

        /* ============================================================
               PRINT WINDOW (για εξαγωγή PDF)
               ============================================================ */
        .print-window {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 30px;
            max-width: 900px;
            margin: 0 auto;
        }

        .print-window h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1e3a5f;
            border-bottom: 3px solid #1e3a5f;
            padding-bottom: 10px;
        }

        .print-window .subtitle {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .print-window .print-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 12px;
            page-break-inside: avoid;
        }

        .print-window .print-card .p-name {
            font-weight: 600;
            font-size: 15px;
        }

        .print-window .print-card .p-article {
            font-size: 13px;
            color: #4a5568;
        }

        .print-window .print-card .p-details {
            font-size: 14px;
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 18px;
        }

        .print-window .print-card .p-details .p-fine {
            font-weight: 600;
            color: #dc2626;
        }

        .print-window .print-card .p-details .p-suspend {
            color: #2563eb;
            font-weight: 500;
        }

        .print-window .print-card .p-details .p-points {
            color: #7c3aed;
        }

        .print-window .print-card .p-desc {
            font-size: 13px;
            color: #4a5568;
            margin-top: 6px;
            background: #f1f5f9;
            padding: 8px 10px;
            border-radius: 6px;
        }

        .print-window .no-favs {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 16px;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printArea,
            #printArea * {
                visibility: visible;
            }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 20px;
            }
            .print-window .print-card {
                border: 1px solid #ccc !important;
                page-break-inside: avoid;
            }
            .print-window .print-card .p-desc {
                background: #f9f9f9 !important;
            }
            .no-print {
                display: none !important;
            }
        }

        /* ============================================================
               RESPONSIVE
               ============================================================ */
        @media (max-width: 480px) {
            .header-title {
                font-size: 18px;
            }

            .card .name {
                font-size: 15px;
            }

            .card .details {
                font-size: 14px;
                gap: 4px 12px;
            }

            .filters button {
                font-size: 12px;
                padding: 5px 12px;
            }

            .header-actions button {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }

            .header-actions .pdf-btn {
                font-size: 12px;
                padding: 0 12px;
                height: 34px;
            }

            .card {
                padding: 14px 16px;
                gap: 12px;
            }

            .search-box input {
                padding: 12px 40px 12px 40px;
                font-size: 15px;
            }
        }

        @media print {
            .header,
            .search-box,
            .filters,
            .count,
            .favorite,
            .header-actions {
                display: none !important;
            }

            body {
                background: #fff !important;
                color: #000 !important;
                padding: 0 !important;
            }

            body.dark {
                background: #fff !important;
                color: #000 !important;
            }

            .card {
                border-left-color: #333 !important;
                background: #fff !important;
                box-shadow: none !important;
                transform: none !important;
                filter: none !important;
            }

            .card .severity-bar {
                display: none !important;
            }

            .card .article {
                color: #333 !important;
            }

            .card .details .fine {
                color: #c00 !important;
            }

            .card .details .suspend {
                color: #00c !important;
            }

            .badge-criminal {
                color: #c00 !important;
                background: #fee !important;
            }

            .card .full-description {
                display: block !important;
                background: #f9f9f9 !important;
                color: #333 !important;
                border-left-color: #333 !important;
            }

            .card .desc-toggle {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="header-title">🚗 ΚΟΚ <span>Τσέπης v10.4</span></div>
            <div class="header-actions">
                <button onclick="toggleDark()" aria-label="Εναλλαγή σκούρου θέματος">🌙</button>
                <button onclick="toggleFavorites()" aria-label="Εμφάνιση αγαπημένων">⭐</button>
                <button class="pdf-btn" onclick="exportFavorites()" aria-label="Εξαγωγή αγαπημένων σε PDF">📄 PDF</button>
                <button onclick="window.print()" aria-label="Εκτύπωση όλων">🖨️</button>
            </div>
        </div>
        <div class="search-box">
            <span class="icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Αναζήτηση παράβασης..." oninput="onSearch()">
            <button class="clear-btn" id="clearBtn" onclick="clearSearch()" aria-label="Καθαρισμός αναζήτησης">✕</button>
        </div>
        <div class="filters" id="filterContainer">
            <button class="active" data-filter="all" onclick="setFilter('all')">Όλες</button>
            <button data-filter="στάθμευση" onclick="setFilter('στάθμευση')">Στάθμευση</button>
            <button data-filter="πινακίδες" onclick="setFilter('πινακίδες')">Πινακίδες</button>
            <button data-filter="κίνηση" onclick="setFilter('κίνηση')">Κίνηση</button>
            <button data-filter="ταχύτητα" onclick="setFilter('ταχύτητα')">Ταχύτητα</button>
            <button data-filter="άδειες" onclick="setFilter('άδειες')">Άδειες</button>
            <button data-filter="ασφάλεια" onclick="setFilter('ασφάλεια')">Ασφάλεια</button>
            <button data-filter="μοτοσικλέτα" onclick="setFilter('μοτοσικλέτα')">Μοτοσικλέτα</button>
            <button data-filter="ΕΠΗΟ" onclick="setFilter('ΕΠΗΟ')">ΕΠΗΟ</button>
            <button data-filter="επαγγελματικά" onclick="setFilter('επαγγελματικά')">Επαγγελματικά</button>
            <button data-filter="αλκοόλ" onclick="setFilter('αλκοόλ')">Αλκοόλ</button>
            <button data-filter="υποτροπή" onclick="setFilter('υποτροπή')">Υποτροπή</button>
        </div>
    </div>

    <div class="count" id="countDisplay">
        <span id="countText">0 παραβάσεις</span>
        <span id="favIndicator" style="display:none;">⭐ Αγαπημένα (<span id="favCount">0</span>)</span>
    </div>

    <div class="list" id="listContainer"></div>
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ΧΡΩΜΑΤΑ ΚΑΤΗΓΟΡΙΩΝ (για το αριστερό border)
        // ============================================================
        const categoryColors = {
            'στάθμευση': '#f59e0b',
            'πινακίδες': '#3b82f6',
            'κίνηση': '#ef4444',
            'ταχύτητα': '#f43f5e',
            'άδειες': '#8b5cf6',
            'ασφάλεια': '#10b981',
            'θόρυβος': '#f97316',
            'ΚΤΕΟ': '#64748b',
            'μοτοσικλέτα': '#ec4899',
            'ΕΠΗΟ': '#14b8a6',
            'αλκοόλ': '#f59e0b',
            'επαγγελματικά': '#f97316',
            'υποτροπή': '#dc2626'
        };

        // ============================================================
        // ΧΡΩΜΑΤΑ ΒΑΡΥΤΗΤΑΣ (παστέλ αποχρώσεις)
        // ============================================================
        const severityColors = {
            'none': '#e2e8f0', // καμία αφαίρεση
            '10': '#fef9c3', // 10 ημέρες
            '20': '#fde68a', // 20 ημέρες
            '30': '#fcd34d', // 30 ημέρες
            '40': '#fbbf24', // 40 ημέρες
            '60': '#fb923c', // 60 ημέρες
            '70': '#f87171', // 70 ημέρες
            '90': '#ef4444', // 90 ημέρες
            '180': '#dc2626', // 180+ ημέρες / 1 έτος
            'criminal': '#fca5a5' // πλημμέλημα
        };

        // ============================================================
        // ΒΑΣΗ ΔΕΔΟΜΕΝΩΝ – v10.4 (πλήρης, 126 παραβάσεις)
        // ============================================================
        const data = [
            // ========== ΣΤΑΘΜΕΥΣΗ (Άρθρο 38) ==========
            { id: 1, category: 'στάθμευση', name: 'Σε διάβαση πεζών ή ποδηλατιστών (<5μ.)', article: '38§2α', fine: 30,
                suspend: '40 ημέρες αδ. οδ.', details: 'Αφαίρεση άδειας οδήγησης (κατηγορία Σ)', points: 0,
                criminal: false, half: true,
                fullDescription: 'Απαγορεύεται η στάση ή στάθμευση επί διάβασης πεζών ή ποδηλατιστών και σε απόσταση μικρότερη από πέντε (5) μέτρα εκατέρωθεν αυτής.' },
            { id: 2, category: 'στάθμευση', name: 'Σε ράμπα ΑμεΑ', article: '38§2ιστ', fine: 150,
                suspend: '60 ημέρες αδ. οδ. + 70 ημ. στοιχ. κυκλ.',
                details: 'Αφαίρεση άδειας οδήγησης (20+40 από Σ) + 70 ημ. στοιχ. κυκλοφορίας', points: 0,

        // ============================================================
        // ΣΥΝΑΡΤΗΣΗ ΥΠΟΛΟΓΙΣΜΟΥ ΧΡΩΜΑΤΟΣ ΒΑΡΥΤΗΤΑΣ
        // ============================================================
        function getSeverityColor(suspend, criminal) {
            if (criminal) return severityColors.criminal;
            if (!suspend || suspend === '-') return severityColors.none;

            const lower = suspend.toLowerCase();
            if (lower.includes('10 ημέρες') || lower.includes('10 ημ')) return severityColors['10'];
            if (lower.includes('20 ημέρες') || lower.includes('20 ημ')) return severityColors['20'];
            if (lower.includes('30 ημέρες') || lower.includes('30 ημ')) return severityColors['30'];
            if (lower.includes('40 ημέρες') || lower.includes('40 ημ')) return severityColors['40'];
            if (lower.includes('60 ημέρες') || lower.includes('60 ημ')) return severityColors['60'];
            if (lower.includes('70 ημέρες') || lower.includes('70 ημ')) return severityColors['70'];
            if (lower.includes('90 ημέρες') || lower.includes('90 ημ')) return severityColors['90'];
            if (lower.includes('180 ημέρες') || lower.includes('180 ημ') || lower.includes('1 έτος') || lower.includes(
                    'μήνες')) return severityColors['180'];
            if (lower.includes('ακινητοποίηση') || lower.includes('οριστική')) return severityColors.criminal;

            return severityColors.none;
        }

        // ============================================================
        // ΚΑΤΑΣΤΑΣΗ & ΣΥΝΑΡΤΗΣΕΙΣ
        // ============================================================
        let currentFilter = 'all';
        let showFavorites = false;
        let favorites = JSON.parse(localStorage.getItem('kok_favorites')) || {};
        let openDescriptions = {};

        function toggleDark() {
            document.body.classList.toggle('dark');
            render();
        }

        function toggleFavorites() {
            showFavorites = !showFavorites;
            document.getElementById('favIndicator').style.display = showFavorites ? 'inline' : 'none';
            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filters button').forEach(b => {
                b.classList.toggle('active', b.dataset.filter === filter);
            });
            render();
        }

        function toggleFavorite(id) {
            favorites[id] = !favorites[id];
            localStorage.setItem('kok_favorites', JSON.stringify(favorites));
            render();
            showToast(favorites[id] ? '⭐ Προστέθηκε στα αγαπημένα' : '⭐ Αφαιρέθηκε από τα αγαπημένα');
        }

        function toggleDescription(id) {
            openDescriptions[id] = !openDescriptions[id];
            render();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timeout);
            t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function getCategoryColor(category) {
            return categoryColors[category] || '#94a3b8';
        }

        function formatFine(fine) {
            if (typeof fine === 'number') return fine + '€';
            return fine;
        }

        function onSearch() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            if (input.value.length > 0) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
            render();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('clearBtn').classList.remove('visible');
            render();
            document.getElementById('searchInput').focus();
        }

        function getFavorites() {
            return data.filter(v => favorites[v.id]);
        }

        function exportFavorites() {
            const favs = getFavorites();
            if (favs.length === 0) {
                showToast('⚠️ Δεν έχετε επιλέξει αγαπημένες παραβάσεις.');
                return;
            }

            const win = window.open('', '_blank', 'width=900,height=700');
            if (!win) {
                showToast('⚠️ Άνοιξε ένα popup για να συνεχίσεις.');
                return;
            }

            const html = `
            <!DOCTYPE html>
            <html>
            <head><title>Αγαπημένες Παραβάσεις ΚΟΚ</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 30px; max-width: 900px; margin: auto; }
                h1 { color: #1e3a5f; border-bottom: 3px solid #1e3a5f; padding-bottom: 10px; }
                .sub { color: #555; margin-bottom: 20px; }
                .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 12px; page-break-inside: avoid; }
                .card .name { font-weight: bold; font-size: 16px; }
                .card .article { color: #555; font-size: 14px; }
                .card .det { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 4px; }
                .card .det .fine { color: #c00; font-weight: bold; }
                .card .det .suspend { color: #00c; font-weight: 500; }
                .card .det .points { color: #7c3aed; }
                .card .desc { margin-top: 6px; background: #f5f5f5; padding: 8px 10px; border-radius: 6px; font-size: 14px; }
                .footer { margin-top: 30px; font-size: 12px; color: #888; border-top: 1px solid #ddd; padding-top: 10px; }
                @media print {
                    .no-print { display: none; }
                    body { padding: 20px; }
                    .card { border-color: #ccc; }
                    .card .desc { background: #f9f9f9; }
                }
            </style>
            </head>
            <body>
                <h1>🚗 Αγαπημένες Παραβάσεις Κ.Ο.Κ.</h1>
                <p class="sub">Εξαγωγή από την εφαρμογή «ΚΟΚ – Τσέπης» — ${new Date().toLocaleDateString()}</p>
                ${favs.map(v => `
                    <div class="card">
                        <div class="name">${v.name}</div>
                        <div class="article">Άρθρο: ${v.article}</div>
                        <div class="det">
                            <span class="fine">💰 ${formatFine(v.fine)}</span>
                            ${v.suspend && v.suspend !== '-' ? `<span class="suspend">⛔ ${v.suspend}</span>` : ''}
                            ${v.points > 0 ? `<span class="points">📊 ${v.points} βαθμοί ΣΕΣΟ</span>` : ''}
                        </div>
                        ${v.fullDescription ? `<div class="desc">📖 ${v.fullDescription}</div>` : ''}
                    </div>
                `).join('')}
                <div class="footer">Πατήστε Ctrl+P ή επιλέξτε «Εκτύπωση» για να αποθηκεύσετε ως PDF.</div>
                <div class="no-print" style="text-align:center;margin-top:20px;">
                    <button onclick="window.print()" style="padding:10px 30px;background:#1e3a5f;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;">🖨️ Εκτύπωση / Αποθήκευση ως PDF</button>
                </div>
            </body>
            </html>
            `;

            win.document.write(html);
            win.document.close();
            setTimeout(() => {
                win.focus();
                win.print();
            }, 500);
        }

        function render() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('listContainer');
            const countEl = document.getElementById('countText');
            const favIndicator = document.getElementById('favIndicator');
            const favCount = document.getElementById('favCount');

            let filtered = data.filter(v => {
                if (showFavorites && !favorites[v.id]) return false;
                if (currentFilter !== 'all' && v.category !== currentFilter) return false;
                if (query) {
                    const searchable = (v.name + ' ' + v.article + ' ' + v.category + ' ' + v.details + ' ' + (v
                        .fullDescription || '')).toLowerCase();
                    if (!searchable.includes(query)) return false;
                }
                return true;
            });

            const total = data.length;
            const favsCount = getFavorites().length;
            countEl.textContent = filtered.length + ' από ' + total + ' παραβάσεις';
            if (showFavorites) {
                favIndicator.style.display = 'inline';
                favCount.textContent = favsCount;
            } else {
                favIndicator.style.display = 'none';
            }

            if (filtered.length === 0) {
                container.innerHTML =
                    `<div class="empty"><span class="icon">🔍</span>Δεν βρέθηκαν παραβάσεις<br><span style="font-size:14px;">Δοκίμασε άλλη λέξη-κλειδί</span></div>`;
                return;
            }

            container.innerHTML = filtered.map(v => {
                const color = getCategoryColor(v.category);
                const halfBadge = v.half ? '<span class="badge-half">½ για μοτοσικλέτα</span>' : '';
                const criminalBadge = v.criminal ? '<span class="badge-criminal">ΠΛΗΜΜΕΛΗΜΑ</span>' : '';
                const isDescOpen = openDescriptions[v.id] || false;
                const severityColor = getSeverityColor(v.suspend, v.criminal);

                // Υπολογισμός φόντου για την κάρτα (πολύ ανοιχτό)
                let bgColor = '#ffffff';
                if (v.criminal) {
                    bgColor = '#fef2f2';
                } else if (v.suspend && v.suspend !== '-') {
                    const lower = v.suspend.toLowerCase();
                    if (lower.includes('10 ημέρες') || lower.includes('10 ημ')) bgColor = '#fffbeb';
                    else if (lower.includes('20 ημέρες') || lower.includes('20 ημ')) bgColor = '#fffbeb';
                    else if (lower.includes('30 ημέρες') || lower.includes('30 ημ')) bgColor = '#fef3c7';
                    else if (lower.includes('40 ημέρες') || lower.includes('40 ημ')) bgColor = '#fef3c7';
                    else if (lower.includes('60 ημέρες') || lower.includes('60 ημ')) bgColor = '#fde68a';
                    else if (lower.includes('70 ημέρες') || lower.includes('70 ημ')) bgColor = '#fee2e2';
                    else if (lower.includes('90 ημέρες') || lower.includes('90 ημ')) bgColor = '#fee2e2';
                    else if (lower.includes('180 ημέρες') || lower.includes('180 ημ') || lower.includes('1 έτος') ||
                        lower.includes('μήνες')) bgColor = '#fecaca';
                    else bgColor = '#ffffff';
                }

                // Για dark mode, σκουραίνουμε ελαφρά το φόντο
                const darkBg = document.body.classList.contains('dark') ?
                    (bgColor !== '#ffffff' ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)') :
                    bgColor;

                return `
                <div class="card" style="border-left-color: ${color}; background-color: ${darkBg};">
                    <div class="severity-bar" style="background-color: ${severityColor};"></div>
                    <div class="content">
                        <div class="name">
                            ${v.name} ${halfBadge} ${criminalBadge}
                        </div>
                        <div class="article">Άρθρο: ${v.article}</div>
                        <div class="details">
                            <span class="fine">💰 ${formatFine(v.fine)}</span>
                            ${v.suspend && v.suspend !== '-' ? `<span class="suspend">⛔ ${v.suspend}</span>` : ''}
                            ${v.points > 0 ? `<span class="points">📊 ${v.points} βαθμοί ΣΕΣΟ</span>` : ''}
                        </div>
                        ${v.fullDescription ? `
                            <button class="desc-toggle" onclick="toggleDescription(${v.id})">
                                ${isDescOpen ? '🔽 Κλείσε περιγραφή' : '📖 Περιγραφή'}
                            </button>
                            <div class="full-description ${isDescOpen ? 'open' : ''}">
                                ${v.fullDescription}
                            </div>
                        ` : ''}
                    </div>
                    <button class="favorite ${favorites[v.id] ? 'active' : ''}" onclick="toggleFavorite(${v.id})" aria-label="Προσθήκη/αφαίρεση αγαπημένου">
                        ${favorites[v.id] ? '⭐' : '☆'}
                    </button>
                </div>
            `}).join('');
        }

        // Εκκίνηση
        console.log('Φορτώθηκαν ' + data.length + ' παραβάσεις');
        render();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
                document.getElementById('searchInput').select();
            }
            if (e.key === 'Escape') {
                clearSearch();
            }
        });
    </script>
</body>
</html>
